name: Publish due posts
on:
  schedule:
    - cron: "7 * * * *"        # every hour, at minute 7 (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only (do not post)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency: publish
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Publish
        env:
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: node publish.mjs
      - name: Save what was published
        if: always()
        run: |
          git config user.name "menoro-publisher"
          git config user.email "actions@users.noreply.github.com"
          git add state/published.json
          git diff --cached --quiet || (git commit -m "Record published posts" && git push)
